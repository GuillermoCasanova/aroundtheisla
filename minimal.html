<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lara Torruella — Minimal</title>
    <meta
      name="description"
      content="Minimal black and white portfolio layout — Around The Isla design study."
    >
    <link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin>
    <link href="https://fonts.cdnfonts.com/css/balham" rel="stylesheet">
    <link rel="stylesheet" href="minimal.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <a class="site-logo" href="minimal-home.html" aria-label="Around The Isla — minimal home">
      <img
        src="palm-cion.svg"
        alt=""
        width="174"
        height="269"
        decoding="async"
      >
    </a>

    <div class="page">
      <header class="site-header">
        <h1>lara torruella</h1>
      </header>

      <main id="main" class="layout">
        <div class="gallery" role="region" aria-label="Selected work">
          <figure>
            <img
              src="assets/A7405137%201.png"
              alt="Selected work frame one"
              width="816"
              height="1224"
              loading="eager"
            >
          </figure>
          <figure>
            <img
              src="assets/A7405290-2%201.png"
              alt="Selected work frame two"
              width="816"
              height="1224"
              loading="lazy"
            >
          </figure>
          <figure>
            <img
              src="assets/A7405409%201.png"
              alt="Selected work frame three"
              width="816"
              height="1224"
              loading="lazy"
            >
          </figure>
        </div>

        <div class="canvas" aria-hidden="true"></div>
      </main>

      <footer class="site-footer">
        <span>Concept from Figma — Website AroundTheIsla</span>
        <span class="site-footer-links">
          <a href="minimal-home.html">Minimal home</a>
          <a href="index.html">Main site</a>
        </span>
      </footer>
    </div>
  </body>
</html>
